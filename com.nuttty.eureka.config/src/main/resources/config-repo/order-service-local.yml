server:
  port: 19094

spring:
  application:
    name: order-service

  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: systempass

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/orders
    username: delivery
    password: delivery777
logging:
  level:
    com.p6spy: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 1000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/
  instance:
    hostname: localhost

# springdoc-openapi-ui
springdoc:
  api-docs:
    version: openapi_3_1
    enabled: true
    path: /v3/api-docs
    # 게이트웨이 라우팅에서 prefix를 제거하지 않았다면 해당 설정을 추가
  enable-spring-security: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: refresh
  management:
    zipkin:
      tracing:
        endpoint: "http://localhost:9411/api/v2/spans"
    tracing:
      sampling:
        probability: 1.0

# Naver Direction API
naver:
  direction:
    client-id: ${DIRECTION_CLIENT_ID}
    client-secret: ${DIRECTION_CLIENT_SECRET}

# resilience4j
resilience4j:
  retry:
    instances:
      hubService:
        max-attempts: 3   # 재시도 횟수
        wait-duration: 500ms  # 재시도 대기 시간
        enable-exponential-backoff: true  # 지수 백오프 활성화
        exponential-backoff-multiplier: 2 # 백오프 배수(500ms, 1000ms, 2000ms)
        max-wait-duration: 5000ms  # 최대 대기 시간 5초

